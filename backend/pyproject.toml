[project]
name = "waste-reporter-app"
version = "0.1.0"
description = "Backend API for UrbanPulse Manila waste reporter"
authors = [
    {name = "pookiebear278", email = "mgoblimar@up.edu.ph"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
